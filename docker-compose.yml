services:
  postgres:
    image: postgres:18
    container_name: campusbite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusbite
      POSTGRES_USER: campusbite
      POSTGRES_PASSWORD: campusbite_dev
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: campusbite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: